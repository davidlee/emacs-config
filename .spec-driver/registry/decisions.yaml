decisions:
  ADR-001:
    id: ADR-001
    title: 'ADR-001: Decouple SATAN perception from cognition'
    status: accepted
    path: .spec-driver/decisions/ADR-001-decouple_satan_perception_from_cognition.md
    summary: 'SATAN perception is decoupled from the effecting LLM run: a deterministic
      sensing pass (budget-independent, perceive-side) vs a gated consumer. Per-invocation
      perception-of-record; full replayability over the segment log is deferred to
      IMPR-013 (see 2026-06-09 amendment).'
    created: '2026-06-08'
    updated: '2026-06-09'
    reviewed: '2026-06-09'
    authors:
    - name: David Lee
    deltas:
    - DE-010
    related_decisions:
    - ADR-002
    tags:
    - satan
    - perception
    - architecture
  ADR-002:
    id: ADR-002
    title: 'ADR-002: SATAN arrival via metabolic stochastic gating'
    status: proposed
    path: .spec-driver/decisions/ADR-002-satan_arrival_via_metabolic_stochastic_gating.md
    summary: "PROPOSED: shift SATAN consumer arrival from fixed schedule to attribute-gated\
      \ stochastic \u2014 attributes bias arrival probability and mode; rolls are\
      \ seeded and logged; depends on ADR-001."
    created: '2026-06-08'
