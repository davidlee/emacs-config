[facet]                         # every field typed; seeded empty (captured later)
context = "IMP-030 added pure column layout to dl-umbriel-buffer.el, taking it to 782 lines. STD-001: a file's name states its one concern. DEC-014 fixed umbriel at four files."
choice = "Amends DEC-014: apps/dl-umbriel-columns.el owns laying cells out in aligned columns, a fifth file, tested in lisp/test/dl-umbriel-columns-test.el. It knows no column by name: limits and faces arrive as alists from the buffer."
alternatives = ["keep layout in dl-umbriel-buffer.el", "put layout in dl-umbriel-model.el (the model holds data and labels; display properties are presentation)"]
rationale = "Layout is pure and has no reason to load magit-section; the buffer keeps what each column means. Chosen by the user."
consequences = ["new file must be git added before home-manager switch (trap 1)", "docs/emacs/umbriel.md file table gains a row"]
decided_by = 'user (session 2026-11-07: "moving column layout out would def make sense now")'
