updated = "2026-11-04"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "The buffer needs workspaces with their windows, two focus signals, and display strings, testable without a compositor. json-parse maps false to :false (truthy) by default (verified in emacs --batch -Q)."
choice = """Parse with :object-type alist :array-type list :false-object nil :null-object nil. Accessors are alist-get with a default, so a renamed field degrades to a default rather than an error. Join: windows grouped by their 'workspace' id onto workspaces' 'id'; windows with workspace "" (scratchpad, unassigned) form a trailing group. Order: workspaces by output then index; windows by column, row (tiled first), then floating, then title. Display strings are pure functions of one entry: workspace = name-or-index, layout, window_count, active/focused/urgent marks; window = app_id, title, placement (tile c,r / float / tab i), and separate active and focused marks plus visible/minimized/fullscreen/urgent/xwayland flags. 'visible' is labelled as such, never as on-screen."""
alternatives = ["cl-defstruct records converted at parse", "keep :false and test with eq"]
rationale = "Least code, no conversion layer to drift from the wire format, defaults absorb upstream renames, and nil booleans make every predicate honest."
consequences = ["Every parse site uses one shared parse function with these options", "Tests use hand-written alist fixtures"]
