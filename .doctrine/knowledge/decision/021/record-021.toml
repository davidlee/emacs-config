title = "umbriel actions: one connection each, report failures, re-query when the stream is closed"
record_kind = "decision"
status = "accepted"
created = "2026-11-04"
updated = "2026-11-04"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Each request gets one reply then the server closes (DEC-015, DEC-017 evidence). Actions are fire-and-observe."
choice = "An action runs through the DEC-017 transport, sequenced per DEC-016; a (:failure …) result is echoed with the DEC-015 rendering; (:ok) is silent. After the last step of an action, if the stream is not open, the buffer issues async windows and workspaces queries whose replies go through the DEC-020 state setter. The effect is never assumed; the buffer only shows what the compositor reports."
alternatives = ["optimistic local update", "always re-query even with the stream open"]
rationale = "The stream already reports the effect when open; when it is not, a re-query is the only honest refresh."
