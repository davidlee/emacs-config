[facet]                         # every field typed; seeded empty (captured later)
context = "my-umbriel-map exists at C-c u (core/dl-keymap.el); its commented placeholder is to be deleted. Meow motion state binds bare and Shift arrows to movement; magit-section-mode-map uses TAB, n/p, ^, 1-4, M-n/M-p. User prefers arrows first-class (home context)."
choice = "Global C-c u: u opens the umbriel buffer, w switches workspace (completing-read), l sets the active workspace's layout (completing-read over modes), f focuses this frame; the placeholder comment is deleted. Buffer map (row at point, DEC-016 addressing): RET focus, s switch to the row's workspace, m move window to workspace, t toggle floating, c center, k kill (DEC-019), L set layout, e / E cycle primary extent forward / back, M-<left> and < column-move-left, M-<right> and > column-move-right, C-<left> and [ layout-scroll-left, C-<right> and ] layout-scroll-right, g refresh/reconnect (DEC-018), q quit-window."
alternatives = ["modified arrows only", "brackets only", "C-c u buffer-only", "every v1 action on C-c u"]
rationale = "User chose both directional sets and the buffer-plus-workspace-verbs global map (2026-11-04). Row letters avoid magit-section's defaults."
consequences = ["No new C-c family key; IMP-019 untouched", " CHANGELOG names C-c u u/w/l/f and the buffer keys", "my-umbriel-map is mirrored on the meow leader as SPC u like the other family maps (RV-018)", "The buffer map is a defvar-keymap with inline bindings: policy lint forbids define-key/keymap-set outside family prefixes and my/bind into non my-*-map maps (RV-018)"]
decided_by = "user (directional + global map); agent (row letters)"
decided_on = "2026-11-04"

