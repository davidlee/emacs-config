[facet]                         # every field typed; seeded empty (captured later)
context = 'DEC-013 sends windows with workspace "" to the trailing group, so pad windows show as Unassigned, and a shown pad window reports the workspace it was brought to.'
choice = "Amends DEC-013. dl-umbriel-model-group stays the one grouping function. A group owner is a workspace, a pad entry ((scratchpad . NAME)), or nil. A window whose scratchpad is a non-empty string joins its pad, else its workspace, else the nil group. Order: workspaces, pads by name, nil group. A model function gives a pad the same heading cells as a workspace."
alternatives = []
rationale = "One grouping function keeps every window appearing exactly once, and shared heading cells keep pad headings aligned without a second heading path."
