context = "gptel cannot fetch model lists; per-key filtering of the gateway's /v1/models is unverified."
choice = "Each gateway backend in dl-gptel.el lists its gateway model names statically. A model the key does not allow fails with the gateway's error."
alternatives = ["GET /v1/models at load (slow, fails when the gateway is down)", "generate a model file from ~/flakes"]
rationale = "The list is a curated menu, not the full served set; least code, no startup network."
consequences = ["Lists duplicate part of ~/flakes/agents/gateway.nix and must follow its renames."]
