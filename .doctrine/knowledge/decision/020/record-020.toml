title = "umbriel held state lives in the client and is announced by a hook"
record_kind = "decision"
status = "accepted"
created = "2026-11-04"
updated = "2026-11-04"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "The buffer needs the latest snapshots and stream status; the client must not know the buffer exists."
choice = "dl-umbriel.el holds one private state: latest windows, latest workspaces, stream status (never | open | (:failure KIND DETAIL)), skipped-line count. Snapshots are kept as parsed (DEC-013), keyed by the opaque window id, unknown fields retained. A stream event replaces its family wholesale; a refresh reply writes through the same setter. Two ways to observe it: dl-umbriel-state-changed-hook (no arguments) runs on every change; and a one-shot waiter — register (PREDICATE CALLBACK), and on each change the client calls CALLBACK with (:ok STATE) once PREDICATE holds and drops the waiter, or with (:failure …) if the stream closes first. Readers use accessor functions."
alternatives = ["state in the buffer (couples transport to UI)", "pass snapshots as hook arguments"]
rationale = "One writer, one setter for stream and refresh, and a no-argument hook keeps the client ignorant of its consumers. The waiter is what the frame-identity handshake (IDE follow-up) needs: await the snapshot in which a new frame's window appears — without polling and without coupling the client to frames."
consequences = ["Waiters are pure data plus a callback and tests drive them with hand-fed snapshots", "A waiter never outlives the stream: closing it fails every pending waiter", "A waiter's predicate is also checked at registration; registering while the stream is not open fails at once (RV-018 F-2)"]
