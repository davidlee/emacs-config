[facet]                         # every field typed; seeded empty (captured later)
context = "dl-umbriel-focus-frame queries windows synchronously then runs window-focus via the CLI; DEC-014 gives it its own file in apps/; DEC-017 makes requests async. Its test asserts CLI argv, which no longer exists once no process is executed."
choice = "apps/dl-umbriel-focus.el keeps dl-umbriel-window-id (pure) and dl-umbriel-focus-frame on server-switch-hook, rebuilt as: async windows query -> match (pid, frame name) -> window-focus action request. Its tests move to lisp/test/dl-umbriel-focus-test.el and assert the request objects, replacing the argv test. dl-umbriel--host-environment and dl-umbriel--windows are deleted (no binary is executed)."
alternatives = ["leave it on the CLI (two transports)"]
rationale = "One transport; the focus tests assert what is actually sent (request objects) rather than CLI words."
consequences = ["Frame-name matching keeps its known ambiguity (same title, first match); unchanged here"]
