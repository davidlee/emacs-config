[[finding]]
id = "F-1"
status = "answered"
severity = "minor"
title = "Transport omits :coding and :noquery on connections"
detail = "sec-client never states the connection's coding system or query flag. Window titles are non-ASCII; with :coding 'utf-8-unix the filter receives decoded multibyte text and the decoder carries partial UTF-8 sequences across chunk boundaries (verified in emacs 31.1 --batch over a local socket; json-serialize returns unibyte UTF-8 that passes the encoder unchanged). Without :noquery t, a live stream makes Emacs prompt on exit. Fix: sec-client states both for request and stream connections; a client test asserts them in the faked make-network-process arguments."
disposition = "fix-now"
response = "sec-client now requires :coding 'utf-8-unix and :noquery t on every connection, with the evidence; sec-verification adds the test."

