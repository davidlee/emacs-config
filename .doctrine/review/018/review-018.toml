act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "sec-client now requires :coding 'utf-8-unix and :noquery t on every connection, with the evidence; sec-verification adds the test."

[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "Waiter: no evaluation at registration; never fires when the stream is not open"
detail = """sec-state (DEC-020) evaluates a waiter's predicate only on later changes, and only stream close fails pending waiters. A waiter registered when the predicate already holds waits for an unrelated change; one registered with status never or failed is neither fired nor failed — it outlives a stream that does not exist, against DEC-020's 'a waiter never outlives the stream'. Fix: evaluate once at registration; if the stream is not open, call back at once with the current failure (or (:failure closed "stream not open") for never). Add both cases to the client tests."""
disposition = "fix-now"
response = "sec-state: predicate checked at registration; registering with the stream not open fails at once. DEC-020 consequences updated. Tests added to sec-verification."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "sec-state: predicate checked at registration; registering with the stream not open fails at once. DEC-020 consequences updated. Tests added to sec-verification."

