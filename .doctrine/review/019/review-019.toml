[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "PHASE-05 does not verify the command's action-result and refresh contract"
detail = """
Expected: DEC-021 and design.md:489-511 require the command to execute its plan through send-all, echo a failure and stop, remain silent on success, and refresh both snapshot families after the final success only when the stream is not open. design.md:840-842 also forbids writing an assumed action effect into held state.

Observed (verified plan gap): .doctrine/slice/016/plan.toml:148-152 mentions the send-all/refresh behavior only in the objective. PHASE-05 EX-1..EX-6 (:160-166) and VT-1..VT-4 (:168-172) check the pure addressing plan, kill confirmation, prompt deferral and keys, but none drives a generated command's completion callback. PHASE-01 VT-5 (:52) tests send-all in isolation and PHASE-02 VT-4 (:80) tests refresh in isolation; neither checks that the command wires them together. VH-1 (:173) asks for each action's visible effect or echoed failure, without requiring the stream-closed case or checking that state changes only after replies.

Failure scenario (inference, not an observed implementation defect): a command that sends a correct plan but never invokes refresh after a successful action can pass every listed automated check, and the normal live-stream host check still displays the effect. With the subscription closed, subsequent successful row actions then leave the buffer's held snapshots stale. An optimistic local update or a command that ignores a failed completion is likewise outside the listed behavioral checks.

Repair: add a PHASE-05 exit criterion and VT in lisp/test/dl-umbriel-buffer-test.el exercising the generated command with scripted/delayed send-all results and fake refresh/message functions. Require no refresh before completion; final success with a closed/never-opened stream triggers one refresh of both families; success with an open stream triggers none; failure echoes its rendered kind and prevents remaining steps; commands do not mutate held snapshots to predict an effect. These checks need no live desktop mutation."""
disposition = "fix-now"
response = "Accepted: real gap. PHASE-05 EX-7 + VT-5 (lisp/test/dl-umbriel-buffer-test.el) drive a generated command with scripted send-all and faked refresh/message: no refresh before completion; one refresh of both families on final success only when the stream is not open; none when open; failure echoed, remaining steps not sent; success silent; held state never written."

