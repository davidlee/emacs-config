note = "VERIFIED at plan level. .doctrine/slice/016/plan.toml:72 extends PHASE-02 EX-2 with repeated-open idempotence and no automatic reconnect; VT-5 at :81 requires fake-transport connection-count and sentinel-close checks, using authored stream-open-twice/no-auto-reconnect test names. PHASE-04 EX-7 at :132 and VT-6 at :140 cover consumer creation/open-once; re-invoke/bury/quit retaining the connection; unrelated-buffer kill doing nothing; killing *umbriel* closing exactly once through its buffer-local hook; and g reconnecting only when not open. Checks use fake transport and timers, preserving RV-018 F-14 isolation. These obligations sit on the earliest owning phases and match design.md:280-286, :530-534 and :603-607. No implementation or live lifecycle execution is claimed."

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "PHASE-02 VT-3 mandates a production error-wrapper name in the test file"
detail = """
Evidence: .doctrine/slice/016/plan.toml:79 assigns VT-3 test_file = lisp/test/dl-umbriel-test.el and keywords = ["dl-umbriel-await", "with-demoted-errors"]. The behavior it expects is waiter registration/closure/predicate-error isolation. design.md:271-273 places with-demoted-errors around waiter execution in the client implementation; it does not require that macro in the test harness. The plan skill (.agents/skills/plan/SKILL.md:78-86) defines keywords as raw substrings that must all occur in the ONE mandated file. `doctrine slice verify-vt --help` confirms the gate reads the authored plan and mandated source files and fails on a Fail verdict.

Verified mismatch: an ordinary test can call dl-umbriel-await with a predicate or callback that signals and assert that other waiters and the hook still run, without ever writing with-demoted-errors in the test source. The wrapper belongs in apps/dl-umbriel.el. This is about the mandate's selected file and token, not the expected absence of future tests from the current tree.

Consequence (inference): a correctly implemented and tested waiter can fail the VT shape gate solely because its behavior test lacks an implementation-macro string. Adding that string as a comment would satisfy the gate without strengthening isolation coverage; wrapping the test itself would risk swallowing the very error it needs to expose.

Repair: keep the behavior mandate on the test file and replace the macro keyword with a stable, authored isolation-test name (including a callback-error case to match EX-3 at :73). If the macro's production presence also needs a shape check, give that check its own mandate on apps/dl-umbriel.el. Do not add a wrapper to the test merely to satisfy the substring."""
disposition = "fix-now"
response = "Accepted: macro name belongs to production, not the test. PHASE-02 VT-3 keywords now dl-umbriel-await plus authored test names waiter-signalling-predicate and waiter-signalling-callback (covers EX-3's callback case). No production shape mandate added; the behaviour test is the check."

