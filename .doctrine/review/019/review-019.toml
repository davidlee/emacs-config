[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The buffer-owned subscription lifetime has no acceptance check"
detail = """
Expected: DEC-018 and design.md:280-286, :530-534 require one subscription owned by the buffer: creation opens it, killing that buffer closes it through a buffer-local hook, burying it preserves it, and reconnect is explicit. design.md:847 makes at-most-one connection and reconnect-only-on-g invariants.

Observed (verified plan gap): .doctrine/slice/016/plan.toml:115-120 names my/umbriel, kill-buffer-hook and g in the PHASE-04 objective, but its complete EX/VT/VA lists (:124-139) never exercise the opening command followed by buffer burial or destruction. VT-5 deliberately tests mode/render without my/umbriel, so it cannot check ownership. PHASE-02 EX-2 (:72) states at-most-one connection, but VT-2/VA-1 (:78-81) check status transitions and a single open/close, without repeated-open connection counts or a no-reconnect assertion. PHASE-06 VH-1 (:197) covers restart plus g recovery, but not kill/bury ownership or duplicate openings. This is a gap in the criteria/checks, not a claim that the implementation already leaks.

Failure scenario (inference): attaching close globally instead of buffer-locally makes killing an unrelated buffer disconnect the view; omitting the hook leaves the subscriber alive after its consumer is killed; closing on quit/bury violates the retained-stream behavior. Fixture rendering, throttling tests, one live render, and the specified restart check can all succeed despite these errors. The slice itself identifies subscription lifetime as a principal risk (doctrine show SL-016, Risks & assumptions).

Repair: add fake-transport lifecycle checks at the earliest owning phases. In PHASE-02 assert repeated stream-open creates only one subscription and a close/sentinel does not reconnect on its own. In PHASE-04 add EX plus VT coverage that my/umbriel creates the consumer and opens once, repeated display/burial/quit keeps that connection, killing an unrelated buffer does nothing, killing *umbriel* closes exactly once, and g reconnects only when closed. Stub transport and timers so the test still honors RV-018 F-14 and sends no real action."""
disposition = "fix-now"
response = "Accepted: real gap. PHASE-02 EX-2 extended + VT-5 (repeated stream-open = one connection; no reconnect after close). PHASE-04 EX-7 + VT-6: my/umbriel opens once; re-invoke/bury/quit keep it; unrelated kill no-op; *umbriel* kill closes exactly once; g reconnects only when not open. Fake transport and timers, F-14 respected."

