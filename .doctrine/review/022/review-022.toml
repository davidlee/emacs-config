status = "verified"
severity = "major"
title = "Expected a shown pad window to report a workspace; it reports none"
detail = """
Expected: design Model section and DEC-028 context say a shown pad window keeps a workspace, so row plans still see it.
Observed: live, discord had visible true and workspace "". Grouping is unaffected, but `s` and `L` refused such rows.
"""
disposition = "design-wrong"
response = "Design is wrong, not the code. Reconcile design.md Model; DEC-032 records the correction to DEC-028 context. See the brief."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
