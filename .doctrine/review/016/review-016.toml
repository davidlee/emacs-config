[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "@quick does not turn DeepSeek thinking off"
detail = "(Codex) sec-4 lines 170-175 claim @quick and @think become thinking off and on for deepseek-flash. @quick sends effort low (apps/dl-gptel-presets.el:72) and is left unchanged; research.md Thread 3 records that LiteLLM rewrites only none to thinking disabled and every other value to enabled. So @quick is thinking on, same as @think. The planned VT and G1 cover @think only and would not notice. Proposed repair: a DeepSeek-specific mapping of @quick to none, tested for both presets through the shaper."
disposition = "fix-now"
route = "control"
response = "Confirmed: @quick sends effort low, which LiteLLM maps to thinking enabled. User chose (2026-10-18) to map low to none for deepseek. DEC-005 updated; sec-4 adds the pure shaper dl-gptel-deepseek-thinking (flatten, then low becomes none) as the deepseek entry, with a preset to wire table. Control: the concrete incorrect candidate the check must reject is plain flattening (dl-gptel-flat-reasoning-effort as the deepseek entry), which sends reasoning_effort low. Criterion: the request body for deep plus quick, in either order, has reasoning_effort none and no reasoning key; deep plus think has high. Host phase constraint: the test must run through the real gptel--request-data around-method with a gptel-make-deepseek stand-in, and must be observed failing against plain flattening before the shaper lands. G1 also checks that the quick reply carries no reasoning."

