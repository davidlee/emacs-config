[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Gateway key exposed by gptel debug log and Copy Curl command"
detail = "(Codex, gpt-6-sol) sec-3 lines 104-111 and sec-10 lines 30-31 accept that the gateway key appears in gptel debug logs and in the copied Curl command. gptel-request.el:2856 logs the request config (with the Authorization header) at gptel-log-level debug; gptel.el:1887 builds the copy-curl command via gptel-curl--get-args, which emits -H with the header as an argument. Proposed repair: redact or disable those paths and verify neither exposes a gateway key."
disposition = "tolerated"
route = "review"
response = "Observation confirmed: gptel-request.el logs the request config with the Authorization header at log level debug, and Copy Curl puts a command carrying the header on the kill-ring. Severity contested as blocker: both paths need a deliberate user act, the log is an in-memory buffer, and the key is loopback-only and budget-capped. The cited rule (keys never in argv or logs) came from the review prompt; the user's standing rule is about argv of running processes. Reviewer missed one widening: select-enable-clipboard copies the kill-ring to the system clipboard, so a clipboard manager may persist it. User decided (2026-10-18): keep accepted, document; no redaction, since that means hooking more gptel internals. sec-3, sec-7 and sec-10 now name the clipboard and the *gptel-log* buffer."

[[finding.turn]]
act = "raise"
role = "raiser"

