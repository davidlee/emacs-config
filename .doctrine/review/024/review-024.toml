Observed: `doctrine slice verify-vt SL-018` -> `PHASE-03 ✗ FAIL VT-1 — keyword umbriel-focus-frame absent from test/dl-umbriel-keys-test.el`. Commit 79e5086 (after VH-1 passed) removed the `C-c u f` bind and its declare-function, updated the keys test and DEC-024's choice ("dropped 2026-11-11 by user ruling: a frame that runs a key already has focus"). The package's README was updated in 8d3bb77.
The code follows a user ruling made after the plan; the plan criterion and design prose are stale. It is also a behaviour change, which slice scope put out of scope; the commit carries no SL-018 tag.
"""
disposition = "design-wrong"
response = """
Code follows the user's post-plan ruling (79e5086; DEC-024 choice updated). Plan side settled now as a user-approved escalation (user chose "Waive VT-1, append VT-4" in this session): PHASE-03 VT-1 `waived = true` with waived_reason/by/on; VT-4 appended without `umbriel-focus-frame`; `doctrine slice verify-vt SL-018` now all PASS/WAIVED. Remaining design prose (sec-4 diagram, keymap bullet) goes to reconcile via F-2's brief entry. EX-5 text stays as written (immutable) and is explained by the waiver.
"""

