[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "design Migration table should match shipped bind sites and deletions; it does not"
detail = "design.md § Migration: embark org-mode-map C-, and eshell are routed to ':bind (:map …) on the owning use-package', and org/dl-org-links.el only loses its C-c l. Shipped (4d8fb12, notes PHASE-02): embark uses 'bind-keys :map org-mode-map' inside 'with-eval-after-load 'org' (a :bind on use-package org would defer org); eshell C-r binds on 'use-package esh-mode :ensure nil' (eshell-mode-map is defined in esh-mode) and my/setup-eshell is deleted; org/dl-org-links.el is deleted outright (held only C-c l). Design § Risks anticipated per-site resolution, so behaviour is correct; the design record is stale."
disposition = "verified"
response = "Observation confirmed; code is correct per design § Risks (per-site resolution). Design record update delegated to /reconcile — see Reconciliation Brief (per-slice direct edit, design.md § Migration)."

[[finding]]
id = "F-2"
status = "verified"
severity = "nit"
title = "design Verification ERT names should match shipped tests; they differ"
detail = "design.md § Verification lists form-records/*, violations/*, duplicates/*, l1/family-by-naming. Shipped lisp/test/dl-policy-lint-test.el uses dl-policy-lint/records-*, l2-*, l3-*, l1-family-by-naming, plus extras (records-empty-bind, records-nested, records-quoted-data-ignored, file-*, config-files, records-global-writers). Every designed case has a counterpart (bind-keys :map is inside records-bind-keys). Naming only."
disposition = "tolerated"
response = "Test names are illustrative in the design; every designed case has a shipped counterpart and extra edge-case tests exist. Renaming tests or design for cosmetic parity adds churn with no reader benefit; reconcile may touch it opportunistically when editing design.md § Verification."

[[finding]]
