status = "verified"
severity = "minor"
title = "KEYS.md should state live keys near changed ones; pre-existing stale Jump text found"
detail = "PHASE-03 VA-1 found docs/KEYS.md Jump section (outside the slice's changed keys) claiming C-' was embark-dwim and C-; avy-goto-char-timer. Live: C-' avy-goto-char-2 (editing/dl-motion.el), M-. embark-dwim, C-; iedit-mode, C-./C-S-. goto-chg. Also core/dl-keymap.el comments (L203, L775) said C-; avy. Fixed in 8b6984f."
disposition = "fix-now"
response = "Fixed in 8b6984f: KEYS.md Jump section and prefix index now state C-: / C-' avy, C-; iedit-mode, C-, embark-act, M-. embark-dwim, C-./C-S-. goto-chg; dl-keymap.el comments corrected. Verified by rg against config sources; just check 166/166."

