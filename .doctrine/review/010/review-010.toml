id    = 10
slug  = "external-adversarial-review-codex-sl-012-design-plan"
title = "External adversarial review (codex): SL-012 design + plan"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "plan"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "codex"
responder = "responder"

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-012"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "PHASE-01 test recipe resolves suites from the wrong repo"
detail = """
SL-012 D7's proposed /workspace/satan justfile omits --init-directory even though the copied runner resolves suite dirs relative to user-emacs-directory. Evidence: .doctrine/slice/012/design.md:205-221 proposes 
Error: file-missing ("Cannot open load file" "No such file or directory" "satan-test")
  command-line-1(("-L" "./satan" "-L" "./dev" "-l" "satan-test"))
  command-line()
  normal-top-level(); dev/dl-test.el:30-31,45 expand suite dirs under user-emacs-directory; empirical probe ~/.emacs.d/ run in /workspace/satan prints /root/.emacs.d/ and /home/david/.emacs.d/satan/test prints /root/.emacs.d/satan/test. Reproduction: run those two emacs --batch probes from /workspace/satan."""
disposition = "fixed"
response = "Integrated. design.md D7 'Runner anchor' para: satan-test.el anchors suite dirs to repo root via load-file-name, not user-emacs-directory; PHASE-01 EX-3 amended."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "PHASE-01 ignores the git-tracked-file gate in the destination flake repo"
detail = """
The plan copies a new Elisp tree into /workspace/satan and then asks Nix to evaluate/build it, but never requires those copied files to be git-tracked. Evidence: AGENTS.md:73 says adding a new .el file requires ; AGENTS.md:80 states flake builds see only git-tracked files; .doctrine/slice/012/plan.toml:28-38 defines PHASE-01 success entirely in terms of copied files plus flake eval/build; .gitignore
AGENTS.md
CLAUDE.md
flake.lock
flake.nix
justfile currently shows only the scaffold (.gitignore, AGENTS.md, CLAUDE.md, flake.lock, flake.nix, justfile). Reproduction: .gitignore
AGENTS.md
CLAUDE.md
flake.lock
flake.nix
justfile and compare against PHASE-01 EX-1/VA-3."""
disposition = "fixed"
response = "Integrated. design.md D7 'Flake tracked-file trap' para; new PHASE-01 EX-6: git add copied tree before any flake eval/build gate."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "D4 understates the dl-notes-paths coupling surface"
detail = """
SL-012 D4 claims the coupling surface is '10 files require dl-notes-paths' using four symbols. The tree disagrees. Evidence: .doctrine/slice/012/design.md:68-72 makes the claim; satan/dl-satan-broker.el
satan/dl-satan-context.el
satan/dl-satan-mode.el
satan/dl-satan-motive.el
satan/dl-satan-patch-prompt.el
satan/dl-satan-run.el
satan/dl-satan-sensor-wpm.el
satan/dl-satan-tools-atsatan.el
satan/dl-satan-tools-hippocampus.el
satan/dl-satan-tools-inbox.el
satan/dl-satan-tools-notes.el
satan/dl-satan-tools-org.el
satan/dl-satan-tools.el returns 13 production files, including satan/dl-satan-run.el:14-24, satan/dl-satan-broker.el:42-52, and satan/dl-satan-sensor-wpm.el:19-24, which consume dl-notes-root via  without any . Tests also carry old bindings in satan/test/dl-satan-context-test.el:188-207 and satan/test/dl-satan-integration-test.el:42-43. Reproduction: run the rg command above, then inspect those file ranges."""
disposition = "fixed"
response = "Integrated. D4 rewritten: 13 production consumers (10 requires + 3 transitive: run, broker, sensor-wpm) + 2 test files; decouple gate consumer-based (rg 'dl-notes-' empty repo-wide). PHASE-03 objective amended."

