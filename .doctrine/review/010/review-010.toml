[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "SL-011's new timeout(1) runtime dependency is dropped from SL-012's executable plan"
detail = "The prerequisite slice says the standalone package must document a new runtime dependency on coreutils , but SL-012 never turns that into any criterion. Evidence: .doctrine/slice/011/design.md:21-22 says  becomes a runtime dependency and SL-012 must note it in package docs/requirements; .doctrine/slice/012/design.md:251:timeout defcustoms, tick/subprocess JSONL trace rows. returns only the incidental D9 mention at design.md:251, with no PHASE criterion or verification covering package docs/requirements. Reproduction: run that rg command."
disposition = "fixed"
response = "Integrated. design.md D7 'Runtime dependency note' para; new PHASE-02 EX-6: timeout(1)/coreutils dep recorded in package Commentary/README + devshell coverage."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "PHASE-01 weakens D9's hard SL-011 prerequisite into a waivable note"
detail = "D9 says SL-011 must be implemented and closed before SL-012 execution begins, but PHASE-01 EN-1 turns that into a consult-waivable entrance check. Evidence: .doctrine/slice/012/design.md:253-258 defines the contract; .doctrine/slice/012/plan.toml:24 says 'SL-011 is closed ... or an explicit /consult waiver is recorded in notes.md'; doctrine slice status SL-011 currently reports 'ready' rather than closed. That makes the documented prerequisite abusable at the exact point the plan is supposed to enforce it. Reproduction: run doctrine slice status SL-011 and compare plan.toml EN-1 against design.md D9."
disposition = "fixed"
response = "Integrated with partial contest. Contest: a waiver path per se is D9-sanctioned (design.md D9 explicitly routes descope/stall through /consult). Conceded: plan wording ('waiver recorded in notes.md') was self-serviceable by an agent. EN-1 tightened: sole escape is a /consult run with explicit USER approval recorded; agent-authored note does not satisfy."

[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "PHASE-02's rename gate excludes moved harness/protocol artifacts"
detail = '''
The rename sweep claims to cover the satan repo, but its executable rg gate only names code, tests, bin, and docs, leaving moved Python/protocol files outside the pass condition. Evidence: .doctrine/slice/012/plan.toml:52-55 defines EX-2/EX-5; D1 moves satan/harness and satan/protocol at .doctrine/slice/012/design.md:16-19; current blind-spot strings already exist in satan/harness/protocol.py:4 and :145. Reproduction: satan/bin/satan-run-tick:2:# SATAN tick trigger.  Invokes `my/satan-tick' over emacsclient.
satan/bin/satan-run-tick:3:# The elisp side picks a mode from `dl-satan-tick-pool' and applies
satan/bin/satan-run-tick:6:exec emacsclient --eval "(my/satan-tick)"
satan/bin/satan-run:2:# SATAN run trigger.  Invokes Emacs's `my/satan-run' over emacsclient.
satan/bin/satan-run:6:exec emacsclient --eval "(my/satan-run \"$mode\")"
satan/bin/satan-rebuild-interventions:3:# `my/satan-rebuild-interventions' over emacsclient; the elisp side
satan/bin/satan-rebuild-interventions:4:# replays every intervention audit-event under `dl-satan-runs-dir'
satan/bin/satan-rebuild-interventions:8:exec emacsclient --eval "(my/satan-rebuild-interventions)"
satan/harness/protocol.py:4:harness side. Keep in lockstep with `../dl-satan-protocol.el` and
satan/harness/protocol.py:145:# Mirror of `dl-satan-audit-validate-actions` on the elisp side. The four.'''
disposition = "fixed"
response = "Integrated. D3 harness para: comment references (protocol.py <-> dl-satan-protocol.el, dl-satan-audit-validate-actions) update with sweep; rename gate now repo-wide. PHASE-02 EX-2 amended."

[[finding]]
id = "F-8"
status = "verified"
severity = "blocker"
title = "PHASE-04 never rewires .emacs.d's batch test entrypoint to the external package"
detail = "The config repo's green gate runs under  with explicit  flags, so changing core/dl-path.el does nothing for the test harness. Evidence: Justfile:19-22 invokes ; PHASE-04 only requires core/dl-path.el and dev/dl-test.el changes at .doctrine/slice/012/plan.toml:94-109 and says nothing about Justfile; EX-5 then deletes .emacs.d/satan. Once that tree is gone, VA-1 cannot honestly mean  unless the batch recipe itself is repointed to the external checkout. Reproduction: inspect Justfile:19-22 and compare it with PHASE-04 EX-1/EX-3/VA-1."
disposition = "fixed"
response = "Integrated. design.md D7 config-side: Justfile check recipe's hardcoded '-L satan -L satan/test' named load-bearing (batch entrypoint bypasses dl-path.el); new PHASE-04 EX-8 requires dropping the flags + doctor-test package resolution via D5 load-path or explicit -L."

