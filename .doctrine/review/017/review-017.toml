[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "DEC-005 and design sec-4 say OpenRouter keeps nested reasoning; code sends flat reasoning_effort"
detail = """
Expected (DEC-005 choice; design sec-4 "Request shaping"): "openrouter" keeps the nested (:reasoning (:effort E)) form.
Observed: apps/dl-gptel-shape.el `dl-gptel-request-shapers` maps "openrouter" to `dl-gptel-flat-reasoning-effort` (a007f3c). This was a user-directed change on 2026-10-18 to conform to flakes:SPEC-001 FR-006 and flakes:DEC-074 (clients send flat reasoning_effort). G2 VH-1 confirmed it live: @gem with @quick gave no reasoning. PHASE-05 plan: VT-2 waived, VT-3 and EX-7 appended.
Canon still describes the superseded form.
"""
disposition = "design-wrong"
response = """
The canon is wrong; the code is right, as the user directed with flakes:SPEC-001 FR-006 as canon. Reconcile: supersede DEC-005 with a decision that all three gateway backends send flat reasoning_effort, keeping deepseek's low→none mapping; edit design sec-4 "Request shaping" to match. Brief: Governance (DEC-005) and Per-slice (design sec-4).
"""

