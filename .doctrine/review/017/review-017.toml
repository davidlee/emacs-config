contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance self-audit of SL-015 at e4e2c86. Examined:
- `slice conformance` (16 conformant, 0 undelivered, 2 undeclared, dispositioned F-3/F-4);
- `verify-vt` (all attributable pass; PHASE-05 VT-2 waived by user direction);
- `just check` 219/219;
- user-observed G1/G2;
- the key-handling invariants, against dl-llm-gateway.el and gptel's curl argv construction;
- wire-contract conformance to flakes:SPEC-001 FR-006;
- canon drift from the PHASE-05 user direction and from satan:SL-022's cf9d419.
Seven findings, none blocking: three design-wrong, routed to the reconciliation brief; one tolerated; three follow-ups (IMP-028, IMP-026, CHR-008).
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
