[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Design sec-9 and PHASE-06 criteria describe a dl-secret surface that no longer exists"
detail = """
Expected (design sec-9 VA list; PHASE-06 EX-1/VA-2): `my/satan-credential` stays in lisp/dl-secret.el.
Observed: satan:SL-022 removed it, along with its tests and `satan-credential-function` in apps/dl-satan.el (cf9d419, under that slice's DEC-042). That removal is correct.
Also stale in design sec-9:
- the VA-1 positive control expects matches in apps/dl-eca.el, but PHASE-03 removed that code;
- the line numbers for dl-secret.el and dl-secret-test.el are wrong, because cf9d419 reindented both.
PHASE-06 VA-2 says org-gcal loads "under just check", but `just check` never loads org/dl-org-gcal.el. It was checked by a full-init batch smoke instead.
"""
disposition = "design-wrong"
response = """
SL-022's removal is correct, so the design must stop asserting the old surface. Reconcile by editing design sec-9: drop my/satan-credential from the retained list and cite cf9d419 and satan:SL-022 DEC-042; drop the dl-eca.el positive-control expectation; replace the stale dl-secret line numbers with symbol names. Plan criteria are immutable and off the reconcile surface. PHASE-06 EX-1 and VA-2 stay as written, and the phase-06 sheet already records the drift and the smoke evidence.
"""

