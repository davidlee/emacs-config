[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Expected design § Held state/§ Stream to match the client; observed five unstated or contradicted behaviours"
detail = """
Expected: design § Announcing change, § The stream connection, § Stream lines describe apps/dl-umbriel.el.
Observed:
- Waiters isolated with `condition-case`, not `with-demoted-errors` (design :272); with-demoted-errors returns the message string on a signal, which reads as "predicate held".
- Refresh writes per family via `dl-umbriel--refresh-families` (dl-umbriel.el:399), not `dl-umbriel-send-all` (which surfaces only the last reply).
- Rule not in design: detach (or subscribe) before announcing a status, so a hook/waiter that reconnects keeps its connection (PHASE-02 review, reentrancy bugs verified by probe).
- § Stream lines table lacks the row: windows/workspaces event without `data` is skipped (counted), not taken as empty.
- Close on request fails pending waiters with (:failure closed "stream closed"); design names no failure for that edge.
"""
disposition = "design-wrong"
response = """
Each behaviour is a reviewed fix with tests. Reconcile: design.md § Announcing change, § The stream connection, § Stream lines, § Held state (refresh) direct edit. Brief (F-5).
"""

