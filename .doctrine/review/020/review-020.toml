[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected design § Actions/§ Keys to match the shipped row actions; observed text predating DEC-025, DEC-026 and the L skip-switch"
detail = """
Expected: design.md § Addressing, § One table, prompts and § Keys describe the row actions as built.
Observed (design.md vs apps/dl-umbriel-buffer.el):
- § Addressing table: `focused` window row = [window-focus ID, ACTION]. Code (DEC-025): [window-focus ROW, ACTION, window-focus PREVIOUS] when the held focused workspace's focused_window is known and differs.
- § One table :452-453 still lists my/umbriel-scroll-left/right (DEC-026 removed them); :468-469 "non-silent form … -silent is not in v1" — code sends window-move-to-workspace-silent (buffer.el:272).
- § Addressing `active-workspace` = [switch SELECTOR, ACTION] always. Code omits the switch when the target is the held focused workspace (commit 23973e7; cause: umbriel back_and_forth toggles a switch to the active workspace, actions.cpp:1597, workspace.cpp:3568).
- § Keys buffer table :680-681 lists C-<left>/[ and C-<right>/] (removed by DEC-026; negative test scroll-keys-are-gone).
Governance side: DEC-016 ("switches to it first"; consequence "-silent not in v1") and DEC-024 (key list) are amended by DEC-025/DEC-026 in their own text, but the L skip-switch has no decision record — it amends DEC-016's active-workspace rule.
Evidence: doctrine show DEC-025, DEC-026; notes.md § Autonomy log PHASE-05 lines; VH-1 re-check passed by user.
"""
disposition = "design-wrong"
response = """
Code is right (user-decided DEC-025/026; L skip-switch fixes a VH-1 fault, user re-check passed). Reconcile: design.md § Addressing, § One table, prompts, § Keys direct edit; the L skip-switch amendment to DEC-016's active-workspace rule needs a governance record. See RV-020 Reconciliation Brief (F-1).
"""

