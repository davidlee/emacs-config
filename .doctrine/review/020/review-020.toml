[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Expected design § Repaint to describe what keeps point and folds; observed 'without extra code' claim is wrong"
detail = """
Expected: § Repaint accurately states what a repaint must restore.
Observed:
- "Keeping folds … without extra code" is false: the visibility cache sets `hidden`, but only `magit-section-show` on the root creates the overlays; repaint must also reset magit's highlight state and the modified flag, as magit-refresh-buffer does (PHASE-04, both reviews VERIFIED by probe).
- Keeping point names goto-successor only; erase-buffer resets every window-point and window-start, so code restores both per window (magit-mode's pattern).
- DEC-022's rationale "ids keep point on the same window" oversells it for drags between workspaces: the ident changes and point falls to a sibling (design :593-595 does say this; DEC-022 does not).
- Unstated order: kill hook closes the stream before cancelling the repaint timer (close announces; the reverse order re-arms the timer).
"""
disposition = "design-wrong"
response = """
Design's fold claim was disproved by probe; code follows magit-refresh-buffer. Reconcile: design.md § Repaint direct edit; DEC-022 rationale qualified on the governance surface. Brief (F-6).
"""

