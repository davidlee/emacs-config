name      = "Remove 1Password provider-key paths; docs"
objective = "Delete my/op-key, my/op-key-vault and my/op-read-env now that nothing calls them, and bring the docs to the final state (design sec-7, sec-9 VA)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 complete." },
]
exit_criteria = [
